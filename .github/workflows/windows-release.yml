name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version matching Cargo.toml (for example v1.0.0)'
        required: true
        default: v1.0.0
        type: string
      source_ref:
        description: 'Optional commit or branch to build before tagging; otherwise build release_tag'
        required: false
        default: ''
        type: string

# This workflow only produces artifacts. Publishing a GitHub Release is separate.
permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.release_tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check PowerShell and Rust syntax
        run: |
          Get-ChildItem scripts/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting failed.' }
      - name: Test Windows runtime and web UI
        run: |
          cargo test --locked --all-targets --all-features --target x86_64-pc-windows-msvc -- --test-threads=4
          if ($LASTEXITCODE -ne 0) { throw 'Windows Rust tests failed.' }
          node --test web/app.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Web UI tests failed.' }
      - name: Locate Inno Setup
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw 'The Windows runner does not have Inno Setup 6. Review the runner image before rebuilding.'
          }
          Write-Host "Using Inno Setup $((Get-Item -LiteralPath $iscc).VersionInfo.FileVersion)"
      - name: Build self-contained x64 installer
        env:
          POOL_ROUTER_RELEASE_TAG: ${{ inputs.release_tag }}
        run: ./scripts/windows/build.ps1 -ReleaseTag $env:POOL_ROUTER_RELEASE_TAG
      - name: Smoke test installed application
        run: ./scripts/windows/smoke.ps1 -Installer ./dist/windows/PoolRouter-Windows-x64-Setup.exe
      - name: Upload verified installer and checksum
        uses: actions/upload-artifact@v4
        with:
          name: PoolRouter-Windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/windows/PoolRouter-Windows-x64-Setup.exe
            dist/windows/PoolRouter-Windows-x64-Setup.exe.sha256
