name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Rust lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Run Rust tests
        run: cargo test --all-targets --all-features --locked -- --test-threads=4
      - name: Run web state tests
        run: node --test web/app.test.cjs
      - name: Check installer syntax
        run: bash -n scripts/macos-install.sh scripts/macos-uninstall.sh
